{% extends 'Adminapp/base_admin.html' %}

{% load static %}

{% block title %}
Edit Subcategory | ShopEase
{% endblock %}

{% block page_title %}
Edit Subcategory
{% endblock %}

{% block content %}

<link
    rel="stylesheet"
    href="{% static 'Adminapp/css/admin-subcategory.css' %}"
>

<div class="subcategory-form-page">

    <div class="form-card">

        <div class="form-header">

            <div>

                <h1>
                    Edit Subcategory
                </h1>

                <p>
                    Update subcategory information
                </p>

            </div>

            <a
                href="{% url 'admin_subcategory_list' %}"
                class="back-btn"
            >
                ← Back
            </a>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Category
                    <span>*</span>
                </label>

                <select
                    name="category"
                    required
                >

                    {% for category in categories %}

                    <option
                        value="{{ category.id }}"
                        {% if category.id == subcategory.category_name.id %}
                            selected
                        {% endif %}
                    >

                        {{ category.category_name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>
                    Subcategory Name
                    <span>*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    id="subcategory_name"
                    value="{{ subcategory.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Slug
                </label>

                <input
                    type="text"
                    name="slug"
                    id="subcategory_slug"
                    value="{{ subcategory.slug }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                >{{ subcategory.description }}</textarea>

            </div>


            <div class="status-check">

                <input
                    type="checkbox"
                    name="status"
                    id="status"
                    {% if subcategory.status %}
                        checked
                    {% endif %}
                >

                <label for="status">
                    Active Subcategory
                </label>

            </div>


            <div class="form-actions">

                <a
                    href="{% url 'admin_subcategory_list' %}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >

                    <i class="fa-solid fa-save"></i>

                    Update Subcategory

                </button>

            </div>

        </form>

    </div>

</div>

<script src="{% static 'Adminapp/js/admin-subcategory.js' %}">
</script>

{% endblock %}
