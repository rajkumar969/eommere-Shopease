{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | ShopEase</title>

    <link
        rel="stylesheet"
        href="{% static 'Adminapp/css/admin_login.css' %}"
    >

</head>


<body>


<div class="admin-login-page">


    <div class="admin-login-card">


        <!-- Logo -->

        <div class="admin-logo">

            <h1>
                Shop<span>Ease</span>
            </h1>

            <p>
                Admin Panel
            </p>

        </div>


        <!-- Heading -->

        <div class="login-heading">

            <h2>
                Admin Login
            </h2>

            <p>
                Login to manage your e-commerce website
            </p>

        </div>


        <!-- Messages -->

        {% if messages %}

            {% for message in messages %}

                <div class="message {{ message.tags }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- Login Form -->

        <form
            method="POST"
            action="{% url 'admin_login' %}"
        >

            {% csrf_token %}


            <!-- Email -->

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="admin-login-btn"
            >

                Login to Dashboard

            </button>


        </form>


        <div class="back-home">

            <a href="{% url 'home' %}">
                ← Back to Website
            </a>
       

        </div>


    </div>


</div>


</body>

</html>
